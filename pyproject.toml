[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kitty-lsi"
version = "0.1.0"
description = "An ls with real image thumbnails, right inside Kitty."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["Pillow>=12.3.0,<13", "wcwidth>=0.2.13,<1"]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1", "build>=1.2,<2", "pip-audit>=2.7,<3"]

[project.scripts]
lsi = "kitty_lsi.cli:main"
lli = "kitty_lsi.cli:lli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
